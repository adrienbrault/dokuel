name = "dokuel-signaling"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "signal.dokuel.com", custom_domain = true }
]

[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["SignalingRoom"]

[[ratelimits]]
name = "TURN_RATE_LIMITER"
namespace_id = "2026090501"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "EVENT_RATE_LIMITER"
namespace_id = "2026090502"
simple = { limit = 120, period = 60 }

[[analytics_engine_datasets]]
binding = "PRODUCT_ANALYTICS"
dataset = "dokuel_product_events"
