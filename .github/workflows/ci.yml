name: CI

# push+pull_request unfiltered ran every PR commit twice (once per
# event). Scoping push to main keeps exactly one run per PR commit and
# still gates direct pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs when a PR gets a new push; never cancel a
# main run, so every landed commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:signaling
      # Coverage, not plain test: the thresholds in vitest.config.ts
      # are the enforced floor, so a PR that erodes them fails here.
      - run: bun run test:coverage
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/results
          retention-days: 7

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Verify isolated players over direct WebRTC
        run: bun run e2e:network
      - name: Start local TURN relay
        run: |
          docker run --detach --rm --name dokuel-test-turn --network host \
            coturn/coturn:4.17.2-r0-alpine \
            -n --log-file=stdout --listening-port=3478 \
            --min-port=49160 --max-port=49180 --external-ip=127.0.0.1 \
            --realm=dokuel-local-test --user=dokuel:test-only-password \
            --lt-cred-mech --fingerprint --no-tls --no-dtls --no-cli \
            --allow-loopback-peers
      - name: Verify forced relay and recovery
        run: bun run e2e:network
        env:
          DOKUEL_FORCE_RELAY: "1"
      - name: Stop test relay
        if: always()
        run: docker stop dokuel-test-turn || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: network-results
          path: e2e/results
          retention-days: 7
