name: Deploy Signaling Server

on:
  push:
    branches: [main]
    paths:
      - "signaling/**"

  workflow_dispatch:

# The deploy talks to Cloudflare with its own API token; the GitHub
# token only needs to read the repo.
permissions:
  contents: read

# One deploy at a time, newest wins — a stale worker build should not
# land after a newer one.
concurrency:
  group: deploy-signaling
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The worker ships straight to production — never without at
      # least typecheck + lint passing first.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:signaling
      - run: bunx biome check signaling/src

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: signaling
          wrangler-version: "4"
