name: Update README Screenshots

on:
  push:
    branches: [main]
    # Avoid retriggering on the workflow's own README commit.
    paths-ignore:
      - "README.md"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write # push the README commit back to main
  pages: write # deploy to GitHub Pages
  id-token: write # OIDC token for actions/deploy-pages

# Serialize Pages deploys; never cancel a deploy in flight or Pages can end
# up in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Bot identity used by the README commit at the end. Git reads these
    # env vars natively, so no `git config` calls are needed. The 41898282
    # prefix is the github-actions[bot] numeric user-id; using it makes
    # the commit render with the bot's avatar.
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run screenshots

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./e2e/screenshots
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Update README
        run: bun run scripts/update-readme-screenshots.ts

      - name: Commit README
        run: |
          git add README.md
          if git diff --staged --quiet; then
            echo "README screenshot URLs unchanged."
            exit 0
          fi
          git commit -q -m "chore(docs): refresh README screenshots from $GITHUB_SHA"
          git push
